[project]
name = "polynexus"
version = "1.0.0"
description = "PolyNexus — Multi-Technique Polymer Characterization Platform"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jsonschema>=4.0",
    "chromadb>=0.4.0",
    "openai>=1.0.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "PySide6>=6.5",
    "pyFAI>=2024.1",
    "fabio>=2024.4",
    "xarray>=2024.1",
    "lmfit>=1.2",
    "pybaselines>=1.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6.0"]
origin = ["pywin32>=306"]

[project.scripts]
polynexus = "polynexus.__main__:main"
polynexus-gui = "polynexus.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
