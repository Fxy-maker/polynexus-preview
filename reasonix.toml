# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/AppData/Roaming/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 2   # schema marker for diagnostics; old versions may ignore it
default_model = "deepseek-flash"
language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[network]
proxy_mode = "auto"   # auto|env|custom|off; auto currently uses env proxy
# proxy_url  = "socks5://127.0.0.1:7890"   # optional custom override
# no_proxy   = "localhost,127.0.0.1,.local"   # honored for proxy_mode = "custom"

[network.proxy]
type = "socks5"   # http|https|socks5|socks5h
# server = "127.0.0.1"
# port = 7890
# username = ""
# password = "${REASONIX_PROXY_PASSWORD}"   # optional; supports ${VAR} expansion

[agent]
system_prompt = """
You are Reasonix, a coding agent focused on executing code tasks.
Use the provided tools to read and write files and run shell commands.
Principles: understand the request before acting; verify with tools instead of
guessing; keep changes minimal and correct; briefly summarize what you did.
When the request leaves a real choice to the user — which approach or library,
the scope, or a consequential or ambiguous decision — call the ask tool to offer
2-4 concrete options rather than guessing or burying the question in prose. Skip
it when there's an obvious default; don't ask just to confirm.
For multi-step work, track progress with the todo_write tool: lay out the steps,
keep exactly one in_progress, and flip each to completed as you finish it — update
the list as you go, not just at the end.
In plan mode the harness blocks writer tools: do read-only research, then write a
concise plan as your reply and stop. The user is asked to approve before anything
is changed; once approved, work through the steps, updating the task list as you go."""
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
# max_steps         = 0   # executor tool-call rounds; 0 = no limit
# planner_max_steps = 12   # planner read-only tool-call rounds; 0 = no limit
temperature       = 0.0
auto_plan   = "on"   # off|on; off keeps plan mode manual
# reasoning_language = "zh"   # visible reasoning language: auto|zh|en
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.5   # notice only; keeps cache-first prefix intact
compact_ratio       = 0.8   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9   # force compacting at this high-water mark
# keep                = ["errors"]   # compaction keep policy: errors, user_marked
# recent_keep         = 2   # minimum recent messages kept verbatim
cold_resume_prune   = true   # elide stale tool results when reopening a session past the provider cache window
# planner_model = "mimo"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[[providers]]
name        = "deepseek-flash"
kind        = "openai"
base_url    = "https://api.deepseek.com"
models      = ["deepseek-v4-pro"]
default     = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"   # optional; wallet-balance endpoint shown in the status bar
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }   # provider-wide fallback, per 1M tokens

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap

[tools.background_jobs]
stalled_warning_seconds = 900   # warn once per background job after this many quiet seconds; 0 disables

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
# Per-call gating. mode = writer fallback when no rule matches: ask|allow|deny.
# Readers always default to allow. Precedence: deny > ask > allow > fallback.
# Rules are "Tool" or "Tool(specifier)"; e.g. Bash(go test:*), Edit(src/**).
mode  = "ask"
# deny = ["Bash(rm -rf*)", "Bash(git push*)"]   # hard-blocked in every mode
allow = ["Bash(cd D:\\PolyNexus; python -c \"\nfrom polynexus.core.nmr_engine.io import load_project\n# Load raw FID spectrum\nspecs = load_project(r'测试数据/NMR数据/液体核磁/H谱')\nspec = specs[0]\nprint('nucleus:', spec.nucleus)\nprint('ppm length:', len(spec.ppm))\nprint('ppm range:', spec.ppm[0], '~', spec.ppm[-1])\nprint('intensity range:', spec.intensity.min(), '~', spec.intensity.max())\nprint('metadata:', spec.metadata)\n\" 2>&1)", "Bash(cd D:\\PolyNexus; python -c \"\nfrom polynexus.plotting.sci_style import set_sci_style\nset_sci_style()\nimport matplotlib as mpl\nprint('font.family =', mpl.rcParams['font.family'])\nprint('font.sans-serif =', mpl.rcParams['font.sans-serif'][:5])\nprint('svg.fonttype =', mpl.rcParams['svg.fonttype'])\nprint()\n# Check if Arial is actually available on this system\nimport matplotlib.font_manager as fm\nfonts = [f.name for f in fm.fontManager.ttflist if 'arial' in f.name.lower()]\nprint('Arial variations found:', fonts[:10] if fonts else 'NONE')\n# Check default sans-serif fallback\nfallback = [f.name for f in fm.fontManager.ttflist if f.name in mpl.rcParams['font.sans-serif']]\nprint('Available sans-serif fonts:', fallback[:10])\n\")", "task", "Bash(Get-Content \"tests/eval/cases/real/waxs_real_static_pa6.json\" -Encoding UTF8 | ConvertFrom-Json | Select-Object case_id, data_file, polymer_name, source)", "Bash(Get-Content \"tests/eval/cases/synth/waxs_synth_pa6_alpha.json\" -Encoding UTF8 | ConvertFrom-Json | Select-Object case_id, data_file, polymer_name, source)", "Bash(if (Test-Path \"tests/test_phase3.py\") { Write-Output \"EXISTS: tests/test_phase3.py\"; (Get-Item \"tests/test_phase3.py\").Length } else { Write-Output \"NOT FOUND: tests/test_phase3.py\" })", "Bash($files = @(\"polynexus/orchestrator.py\",\"polynexus/config_bridge.py\",\"polynexus/core/residual_analyzer.py\",\"tests/test_phase3.py\"); foreach ($f in $files) { if (Test-Path $f) { $lines = (Get-Content $f).Count; Write-Output \"✅ $f ($lines lines)\" } else { Write-Output \"❌ $f\" } }; Write-Output \"---\"; Write-Output \"Missing: BaseEngine.run_pipeline_from_arrays\"; Select-String -Path \"polynexus/core/engine.py\" -Pattern \"run_pipeline_from_arrays\" -Quiet)", "Bash(Select-String -Path:*)", "Bash($count = (Select-String -Path \"polynexus/core\" -Pattern \"except Exception:\" -Recurse | Where-Object { $_.Line -notmatch \"as \\w\" }).Count; Write-Output \"Bare except count in polynexus/core/: $count\")", "Bash($files = Get-ChildItem -Path \"polynexus/core\" -Recurse -Include \"*.py\" -Exclude \"*.bak*\",\"__pycache__*\"; $total = 0; foreach ($f in $files) { $c = (Select-String -Path $f.FullName -Pattern \"except Exception:\" | Where-Object { $_.Line -notmatch \"as \\w\" }).Count; $total += $c }; Write-Output \"Bare except count: $total\")", "Bash(Get-Content \"pyproject.toml\" | Select-Object -First 30)", "Edit"]
# ask = ["Edit(src/**)"]   # force a prompt even if otherwise allowed

[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) and allow_write extras.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

